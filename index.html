    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a pinned theme before first paint (no flash). Not a module, not deferred.
      {
        let pinned = null;
        try {
          pinned = localStorage.getItem('color-scheme');
        } catch {}
        if (pinned === 'light' || pinned === 'dark') {
          document.documentElement.dataset.theme = pinned;
          document.querySelector('meta[name="color-scheme"]').content = pinned;
        }
      }
    </script>
